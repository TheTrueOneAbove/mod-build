name: Build mod jar
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - name: Build
        run: gradle build --no-daemon
      - name: Publish jar as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "jar-${{ github.run_number }}" build/libs/thetrueoneabove-1.0.0.jar --title "TheTrueOneAbove jar #${{ github.run_number }}" --notes "Forge 1.20.1 mod jar"
      - uses: actions/upload-artifact@v4
        with:
          name: thetrueoneabove-jar
          path: build/libs/*.jar
